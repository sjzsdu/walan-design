[project]
name = "walan-design"
version = "0.1.0"
description = "AI 花型设计自动售卖流水线 — 从趋势采集到瓦栏上传全自动化"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "Pillow>=10.0",
    "numpy>=1.24",
    "openai>=1.0",
    "psd-tools>=1.9.0",
    "apscheduler>=3.10",
    "typer>=0.12",
    "rich>=13.0",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0",
]

[project.scripts]
walan-design = "walan_design.cli:app"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/walan_design"]
