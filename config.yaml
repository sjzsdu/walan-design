# ========================================
# 瓦栏 AI 花型设计自动售卖 - 全局配置
# ========================================
# 修改此文件即可调整所有参数，无需改代码
# 所有默认值已对齐瓦栏《花型设计作品上传标准》PDF 原文

# --- 瓦栏账号 ---
walan:
  base_url: "https://www.walanwalan.com"
  upload_url: "https://www.walanwalan.com/console/designs/all/page1/?upload=1"
  browser: "ego-lite"
  auto_publish_zone: "public"
  sell_type: "buyout_download"
  price_tier: "tier_299"
  custom_price:
    buyout: 299
    download: 99
    psd: 50
  tag_min: 3
  tag_max: 5
  existing_tags:
    - 几何
    - 动物
    - 抽象
    - 植物
    - 花卉
    - 田园
    - 蝴蝶
    - 豹纹
    - 卡通
    - 传统花卉

# --- 趋势采集 ---
trend:
  sources:
    # browser = ego-browser 真实浏览器采集
    # walan      = 瓦栏公开区在售花型+价格（国内最强趋势信号）
    # popfashion = POP服装趋势网趋势标题
    # pinterest  = Pinterest（国内需代理，已验证代理可用 ✅）
    - name: "browser"
      enabled: true
      keywords: "walan,popfashion,pinterest"
      max_items: 60
    - name: "pinterest"
      enabled: true    # 代理已加，重新启用
      keywords: "pattern design, fabric pattern, floral pattern, geometric pattern"
      max_items: 30
    - name: "behance"
      enabled: false   # 需代理
      keywords: "surface pattern design, textile pattern"
      max_items: 20
    - name: "patternbank"
      enabled: false   # 偶尔可达，不稳定
      keywords: "trending patterns"
      max_items: 20
  llm:
    provider: "openrouter"
    model: "openrouter/auto"   # 自动选最便宜可用模型，或指定 "anthropic/claude-3.5-sonnet" / "openai/gpt-4o-mini"
    base_url: "https://openrouter.ai/api/v1"
    api_key: ""   # 留空则从环境变量 OPENROUTER_API_KEY 读取
  # 视觉 LLM（分析真实趋势图 / 免费视觉模型；备选 "openrouter/free"）
  vision:
    model: "dots-studio/dots-3-note-preview:free"
    max_images: 8    # 每次分析附给模型的真实趋势图数量
  # ego-browser 采集参数
  browser:
    scrolls: 3              # 每个关键词页面滚动次数
    scroll_wait_ms: 1500    # 滚动间隔等待
    max_images_per_keyword: 40
    timeout_s: 300
    download_dir: "output/trends/images"
    max_download: 16        # Pinterest 也加进来了，多给 4 张
    # 采集去重：pHash 汉明距离 ≤ 此值视为已采过，跳过不下载
    dedup_phash_threshold: 6
    # 瓦栏翻页轮换：每天从第几页开始（0=page1, 1=page2, ...），跨天递增
    walan_page_rotation: true
  brief_count: 1
  output_dir: "output/trends"

# --- AI 花型设计 ---
design:
  # 花型类型偏向：traditional（传统花型，颜色离散、按色制版） /
  #   digital（数码花型，渐变丰富、全彩不受限） /
  #   mixed（混合，让 LLM 根据趋势图自选，推荐）
  brief_type: "mixed"
  # 供应商选择：stability / dalle / stable_diffusion
  # stability: 云端 SDXL API（推荐，质量高，~$0.03/张）
  # dalle: OpenAI DALL-E 3（接入简单，~$0.04-0.12/张）
  # stable_diffusion: 本地 SD WebUI（免费但需 GPU）
  engine: "stability"
  output_dir: "output/designs"

  # 各供应商配置
  stability:
    api_key: ""  # 留空则从环境变量 STABILITY_API_KEY 读取
    model: "SDXL-1.0"  # 代码内归一化：SDXL-1.0 / sdxl-1.0 → sdxl-v1；也可直接写 sdxl-v1 / core / ultra

  dalle:
    api_key: ""  # 留空则从环境变量 OPENAI_API_KEY 读取
    model: "dall-e-3"

  stable_diffusion:
    api_url: "http://127.0.0.1:7860"
    checkpoint: "v1-5-pruned-emaonly.safetensors"
    use_controlnet: true
    controlnet_model: "control_v11p_sd15_tile"
    width: 1024
    height: 1536   # 2:3 比例
    steps: 30
    cfg_scale: 7.5
    batch_size: 1
    negative_prompt: "text, watermark, logo, brand name, low quality, blurry, jpeg artifacts, deformed"

  # 统一生图参数（所有供应商共用）
  common:
    # 生成比例（2:3 = 瓦栏标准 40cm×60cm）
    aspect_ratio: "2:3"
    # 每个设计生成几张候选
    batch_size: 1
    # 通用负画提示词（prompt_engine 会自动追加专业补强项）
    negative_prompt: "text, watermark, logo, brand name, low quality, blurry, deformed"
    # 是否在 prompt 中强调无缝平铺
    emphasize_tiling: true

  # --- Prompt 工程（纺织花型专业术语增强）---
  prompt:
    # 质量增强词：追加在主体描述之后
    quality_boosters: "professional textile surface pattern design, print-ready artwork, high detail, crisp clean edges, rich color depth, award-winning surface design"
    # 构图约束：保证四方连续的均衡排布
    composition_constraints: "balanced all-over repeat layout, evenly distributed motifs, harmonious negative space, flat illustration style, no cropped motifs"
    # 印刷媒介提示：去掉照片感/透视/阴影
    medium_hints: "flat textile print for fabric industry, matte finish, no perspective, no shadows"
    # 额外负向词（与 common.negative_prompt 合并去重）
    negative_extra: "photorealistic photo, 3d render, human, face, hands, signature, frame, border, uneven edges, distorted motifs, cluttered, oversaturated, gradient noise"

  # --- AI 视觉自评闭环（生图后打分，低分带建议重生成）---
  visual_review:
    enabled: true
    model: "dots-studio/dots-3-note-preview:free"   # OpenRouter 免费视觉模型（实测最稳）；备选 "openrouter/free"
    base_url: "https://openrouter.ai/api/v1"
    api_key: ""        # 留空读 OPENROUTER_API_KEY
    threshold: 70      # 低于该分触发重生成（0-100）
    max_retries: 2     # 最多重生成次数

  # --- 一花四色专业调色板 ---
  recolor:
    cluster_count: 8   # 主色聚类数
    # palettes 留空则用内置方案（深底：墨蓝金/酒红夜曲/松林暮色；浅底：奶油乡村/雾霾粉彩/薄荷清晨）
    # 自定义示例：
    # palettes:
    #   dark:
    #     - {name: "午夜玫瑰", colors: ["#1A0B10", "#4A1B2F", "#8C3A52", "#D4A5A5", "#F2E8E8"]}
    #   light:
    #     - {name: "燕麦拿铁", colors: ["#F7F3ED", "#E8DFD3", "#C9B79C", "#9C8468", "#5E5245"]}

  # 一花四色（瓦栏强制标准：2深底+2浅底）
  color_variant_count: 4
  color_variant_mix: 2
  output_dir: "output/designs"

  # 设计风格偏好（影响 prompt 生成和 LLM 分析）
  style_preferences:
    target_market: "fabric_textile"
    preferred_styles:
      - "floral botanical"
      - "geometric modern"
      - "abstract organic"
      - "animal print"
      - "tropical"
    color_schemes:
      - "warm earth tones"
      - "soft pastels"
      - "vibrant tropical"
      - "monochrome elegant"

# --- 超分辨率放大 ---
upscaler:
  # 放大方法：auto / esrgan / lanczos
  # auto: 先试 Real-ESRGAN，失败回退 LANCZOS
  # esrgan: 只用 Real-ESRGAN（需安装，质量最好）
  # lanczos: 只用 PIL LANCZOS（快速但质量一般）
  method: "lanczos"
  # 目标 DPI（放大到该 DPI 对应的像素尺寸）
  target_dpi: 300
  # 瓦栏尺寸 40cm×60cm @300DPI = 4724×7087 px

# --- PSD 文件处理 ---
psd:
  dpi: 300
  color_mode: "RGB"
  # 分层策略:
  #   auto            = 自动判断（推荐）：检测花型颜色离散度，
  #                     传统花型（颜色集中）→ 按色分色分层，
  #                     数码花型（渐变丰富）→ 背景层+主花层
  #   color_layers    = 强制按颜色分色分层（传统花型制版标准，每主色一层透明图层）
  #   background_main = 强制背景层+主花层（数码花型）
  layer_strategy: "auto"
  # auto 判定阈值：median-cut 量化到 8 色后的还原度（1-平均误差/255）
  # 还原度 >= 此值判为传统花型（颜色离散，可按色制版）；否则判为数码花型
  fidelity_threshold: 0.95
  # color_layers 策略的主色数量（自适应起始值，传统花型一般 6-12 色）
  color_layer_count: 8
  # 自适应加色上限（层内色差超标时自动增加，最多到此值）
  max_color_count: 12
  # 层内平均色差容差（0-255，超过则加色重试；越小单色越严格、层数越多）
  color_tolerance: 8
  # 严格单色层：true=每层纯色填充（制版合规，层内单色）；false=保留层内纹理（可能多色）
  pure_color_layers: true
  auto_seamless: true
  # 平铺边缘平均差异容差（0-255）：offset 接回位的接缝=原图内部相邻列，
  # 天然有 ~1-3 灰阶差异（视觉不可见）；mirror 法可设 0（精确相等）
  seamless_tolerance: 3
  # 接回位算法:
  #   offset = 四象限偏移 + 中央宽幅融合（默认，推荐）
  #            接缝移到画面中央处理，外边缘平铺天然无缝，无镜像对称痕迹
  #   mirror = 旧版边缘镜像融合（渐变图会有颜色挤压带、大母题有对称痕迹）
  seamless_method: "offset"
  # 压缩策略（实测 4724×7087×2 层 PSD）:
  #   raw:            351 MB (无压缩，现用路径)
  #   rle:            113 MB (默认)
  #   zip:             54 MB
  #   zip_prediction:  42 MB (最佳，Photoshop CS5+ 支持，目标 50MB 以内)
  compression: "zip_prediction"
  output_dir: "output/psd"

# --- 质量检测 ---
quality:
  enabled: true
  checks:
    resolution: true
    seamless: true
    originality: true    # 已替换为批次级 pHash 去重（见 dedup）
    no_text: true
    color_mode: true
    color_variants: true
    tag_count: true
    dimensions: true
  originality_threshold: 0.85  # 已废弃，dedup 已接管
  on_fail: "skip"
  max_retries: 3
  # --- 防重复检测（Phase 4 新增，替换原 originality no-op）---
  dedup:
    enabled: true
    # pHash 汉明距离阈值（0=完全相同，越大越宽松）
    # 实测：同 brief 配色变体 0-6，不同设计 32-40
    phash_threshold_batch: 10     # 批次内跨设计比对阈值
    phash_threshold_history: 8    # 历史库比对（更严格，避免撞自己）
    # 同一 brief 的配色变体是否豁免（recolor 改配色不改结构，pHash 天然相似）
    same_brief_exempt: true
    # 历史作品指纹库（JSON），发布成功后自动写入
    history_store: "output/history/phash_store.json"

# --- 流水线控制 ---
pipeline:
  batch_count: 1
  manual_review: false
  mode: "full"
  log_level: "INFO"
  temp_dir: "output/temp"
  # 花型集中目录：每个花型一个子目录，存放 PNG/PSD/brief/upload 等全部产物
  runs_dir: "output/runs"
  # 上传任务准备好后自动用 ego-browser 真实上传到瓦栏（false=只准备任务等手动执行）
  auto_upload: true
